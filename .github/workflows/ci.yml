name: ci
on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      # No history needed. Only `check --changed` would need `fetch-depth: 0`.
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # The tests write the JUnit reports the proof layer of `check` reads
      # (packages/skillunit/reports, apps/tinyfetch/reports).
      - run: npx nx run-many -t typecheck build test
      # Needs no API key: lint, proof, and the specs load, their headings exist and requests fit.
      - run: node packages/skillunit/dist/cli.js check --dry-run --reporter github
      - working-directory: apps/tinyfetch
        run: node ../../packages/skillunit/dist/cli.js check --dry-run --reporter github
      # The acceptance scenarios that need no model. Those that do are skipped without a key.
      - run: npx nx e2e tinyfetch-e2e

  skill:
    # SkillUnit checks its own skill against TypeSafe. Skipped on forks, which get no secrets.
    if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository
    needs: build
    runs-on: ubuntu-latest
    env:
      TYPESAFE_API_KEY: ${{ secrets.TYPESAFE_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      # Without the secret the steps below are skipped and the job would pass having run nothing.
      - if: env.TYPESAFE_API_KEY == ''
        run: echo "::warning title=Model tests did not run::TYPESAFE_API_KEY is not set for this repository, so the skill's specs and the scenarios that ask the model were skipped."
      - run: npm ci
      # The build, and the tests that write the reports `check` reads for its proof layer.
      - run: npx nx run-many -t build test -p skillunit tinyfetch
      - if: env.TYPESAFE_API_KEY != ''
        run: node packages/skillunit/dist/cli.js check --reporter github
      - if: env.TYPESAFE_API_KEY != ''
        working-directory: apps/tinyfetch
        run: node ../../packages/skillunit/dist/cli.js check --reporter github
      # Every acceptance scenario, the ones that ask the model included. A scenario whose model
      # answer flips is a finding to look at, not a run to retry.
      - if: env.TYPESAFE_API_KEY != ''
        run: npx nx e2e tinyfetch-e2e

  contract:
    # The typesafe adapter, asked one fixed request against the real API. CI sets no
    # OPENAI_API_KEY, so the contract test skips openai here; run `npx nx contract skillunit`
    # locally with the key in .env to check it. Skipped on forks, which get no secrets.
    if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository
    needs: build
    runs-on: ubuntu-latest
    env:
      TYPESAFE_API_KEY: ${{ secrets.TYPESAFE_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - if: env.TYPESAFE_API_KEY == ''
        run: echo "::warning title=Contract test skipped for typesafe::TYPESAFE_API_KEY is not set for this repository."
      - run: npm ci
      - if: env.TYPESAFE_API_KEY != ''
        run: npx nx contract skillunit
