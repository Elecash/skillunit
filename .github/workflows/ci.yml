name: ci
on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run build
      # Needs no API key: checks that the skill's specs load and their headings exist.
      - run: node dist/cli.js run --config skills/alchemist/alchemist.yaml --dry-run

  skill:
    # Alchemist tests its own skill against TypeSafe. Skipped on forks, which do not get the secret.
    if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository
    needs: build
    runs-on: ubuntu-latest
    env:
      TYPESAFE_API_KEY: ${{ secrets.TYPESAFE_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - if: env.TYPESAFE_API_KEY != ''
        run: node dist/cli.js run --config skills/alchemist/alchemist.yaml
