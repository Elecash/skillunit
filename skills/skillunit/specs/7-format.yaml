section: Spec format

tests:
  - id: extra-key
    scenario: The agent adds a `description` key to a test to explain it.
    question: What happens when SkillUnit loads that spec?
    options:
      error: The spec does not load, because `description` is not an allowed key
      ignored: SkillUnit ignores the key and runs the test
      shown: SkillUnit prints the description in the report
    expect: error

  - id: thresholds-untouched
    scenario: The user has not mentioned thresholds, and some tests pass only with low confidence.
    question: What should the agent do with the thresholds?
    options:
      defaults: Leave them at their defaults
      lower: Lower them in `skillunit.yaml`
      per-spec: Set lower thresholds inside each spec
    expect: defaults

  - id: expect-without-options
    scenario: The agent is writing a test with no `options`.
    question: Which values can `expect` take?
    options:
      yes-no: "`yes` or `no`"
      any: Any label
      none-value: "`none`"
    expect: yes-no
