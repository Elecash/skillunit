section: Set up

tests:
  - id: no-key-yet
    scenario:
      - The user asks for skillunit tests for their skill, and TYPESAFE_API_KEY is not set anywhere.
      - The agent is about to test a skill, but there is no .env file and no API key in the environment.
    question: What should the agent do?
    options:
      dry: Write the specs, run only `--dry-run`, and tell the user the tests have not been sent
      ask: Stop and wait until the user provides a key before writing anything
      skip: Write the specs and report them as passing
    expect: dry

  - id: key-in-config
    # A choice test on purpose: as a yes/no test, common sense answered "no" even with the rule
    # deleted from the skill.
    scenario: CI needs the TypeSafe key, and the agent is setting up the project.
    question: Where should the agent put the key?
    options:
      env: "In `.env` locally, or as the `TYPESAFE_API_KEY` environment variable in CI"
      config: "In `skillunit.yaml`, next to `model`"
      spec: In each spec file
    expect: env

  - id: init-first
    scenario: The project has a SKILL.md but no `skillunit.yaml` and no specs.
    question: What should the agent do first?
    options:
      init: "Run `npx skillunit init` on the skill folder"
      manual: Write `skillunit.yaml` from scratch by hand
      run: "Run `npx skillunit test` to see what happens"
    expect: init

  - id: which-model
    # The skill does not say which TypeSafe model to use.
    scenario: The agent is filling in `skillunit.yaml`.
    question: Which value, exactly as written, should the agent set for `model`?
    options:
      latest: "`jev-latest`"
      pinned: "`jev-1.13.0`"
    expect: none
