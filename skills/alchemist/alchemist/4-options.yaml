section: Choose the options

tests:
  - id: tempting-wrong-answer
    scenario: The rule is "production deploys come from main only; other branches get a preview". The expected option is "only a preview", and the agent is choosing the wrong option to put next to it.
    question: Which wrong option should it use?
    options:
      tempting: "Run `npm run deploy` from that branch"
      absurd: "Roll back the branch"
    expect: tempting

  - id: define-other
    scenario:
      - The agent wants an option for "a command that is not in the list".
      - The agent wants an option meaning "the skill does not say".
    question: May the agent add that option to the test?
    expect: no

  - id: exact-command
    scenario: The test checks that the skill names the preview command, and the exact spelling of the command matters.
    question: How should the agent word the question?
    options:
      exact: "Which command, exactly as written, does the skill give for a preview?"
      loose: "Which command does the skill give for a preview?"
    expect: exact

  - id: add-the-answer
    scenario: The agent is writing a test for the rule "when CI is red, stop and say so". None of the options it has written so far says to stop.
    question: How should it set the expected answer?
    options:
      add: Add an option that says to stop and say so, and expect that option
      expect-none: Set the expected answer to Alchemist's automatic `none`, since no option matches the skill
      closest: Expect the option closest to stopping
    expect: add

  - id: option-labels
    scenario: The agent is naming the options of a test.
    question: Which labels should it use?
    options:
      short: Short lowercase words such as `stop` and `deploy`, with the meaning in the description
      sentences: The full sentence of each answer as the label
      letters: "`a`, `b`, `c`"
    expect: short
