section: Plan the specs

tests:
  - id: one-spec-per-heading
    scenario: The skill is 12,000 characters long, with five headings of about 2,000 characters each.
    question: How should the agent organise the specs?
    options:
      per-heading: One spec per heading, each with `section` set to that heading
      whole: One spec for the whole file, with no `section`
      one-list: One spec whose `section` lists all five headings
    expect: per-heading

  - id: referenced-files
    scenario: The skill has a SKILL.md and four files in `references/` that SKILL.md tells the agent to read. The agent is planning the specs.
    question: Which files should get specs?
    options:
      all: SKILL.md and each referenced file, each with its own specs
      skill-only: Only SKILL.md, because it links to the others
      merged: One spec that lists every file under `section`
    expect: all

  - id: long-heading
    scenario: One heading of the skill is 5,000 characters long and has three subheadings.
    question: How should the agent test it?
    options:
      subheadings: One spec per subheading
      heading: One spec for the whole heading
      shorten: Shorten that part of the SKILL.md first
    expect: subheadings

  - id: short-skill
    scenario: The whole skill is 900 characters with no headings.
    question: How should the agent test it?
    options:
      whole: One spec with no `section`, covering the whole file
      paragraphs: One spec per paragraph
      skip: Skip it, because it is too short to test
    expect: whole

  - id: sentence-without-effect
    scenario: A section includes a sentence about the history of the project, which changes nothing an agent does.
    question: Should the agent write a test for that sentence?
    expect: no

  - id: show-the-list
    scenario:
      - The user says "add Alchemist tests to our skill" and nothing about which parts matter.
      - The user asks for tests for the skill without saying what to focus on.
    question: What should the agent do before writing the tests?
    options:
      show: List the decisions each section forces and show the list to the user
      everything: Write a test for every sentence of the skill
      top-three: Pick the three rules that look most important and test only those
    expect: show

  - id: with-files
    scenario: The skill has a SKILL.md and nine reference files. For the task a group of tests describes, SKILL.md sends the agent to two of the reference files. The agent is adding a spec that checks those rules together with what the agent reads.
    question: What should `with` list?
    options:
      two: The two files SKILL.md sends the agent to for that task
      all: "`all`, so the reader has every file of the skill"
      skill: Only SKILL.md, since every spec reads one file
    expect: two
