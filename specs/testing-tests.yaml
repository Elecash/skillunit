file: testing/tests.md

tests:
  - id: scenario-without-reason
    unit: scenario-without-the-answer
    scenario: The rule is "when production is down, roll back instead of deploying a fix, because a rollback takes a minute and a fix takes ten". The agent is writing the scenario for this rule.
    question: Which scenario should it write?
    options:
      plain: "Production is down after a deploy, and the user has a fix ready."
      leaky: "Production is down after a deploy; a rollback takes a minute and a fix takes ten."
    expect: plain

  - id: ask-about-action
    unit: ask-about-an-action
    scenario: The agent is writing the question for a test about the rollback rule.
    question: Which question should it write?
    options:
      action: "What should the agent do first?"
      recall: "Does the skill mention rollbacks?"
    expect: action

  - id: prefer-choice
    unit: prefer-choice-tests
    scenario: The rule is "never commit the API key", and the agent is choosing the kind of test.
    question: Which kind of test should it write?
    options:
      choice: A test with options, such as where the key should go
      yes-no: A yes/no test asking whether the agent may commit the key
    expect: choice

  - id: allowed-side
    unit: test-where-the-rule-allows
    scenario: A rule forbids `retry` on POST and allows it on PUT. The agent has written one test for it, for a POST, where `retry` must stay off.
    question: Which other test should it add?
    options:
      allowed: A test for a PUT, a case the rule allows, that expects the agent to pass `retry`
      another-post: A test for a second POST, phrased differently, that expects `retry` to stay off
      none-more: No other test; the POST covers the rule
    expect: allowed

  - id: silent-test
    unit: test-where-the-skill-is-silent
    scenario: The skill is a deploy checklist that never mentions database migrations. The agent is writing the tests for that skill.
    question: What should the agent do about migrations?
    options:
      silent-test: Write a test about migrations whose expected answer is `none`
      skip: Write no test about migrations; only test what the skill covers
      closest: Write a test that expects the command closest to a migration
    expect: silent-test

  - id: incomplete-option
    unit: options-cover-the-rule
    scenario: The skill says to quote a command in backticks and ask for it "exactly as written". The agent's expected option mentions only "exactly as written".
    question: What should the agent change?
    options:
      cover: Make each option include the backticks as well, so the options differ only in "exactly as written"
      keep: Nothing; the expected option names the part that matters most
      none-expect: Expect `none`, since no option says everything
    expect: cover

  - id: tempting-wrong-answer
    unit: tempting-wrong-options
    scenario: The user asks to deploy a feature branch to production. The rule is "production deploys come from main only; other branches get a preview", so the test expects "only a preview", and the agent is choosing the wrong option to put next to it.
    question: Which wrong option should it use?
    options:
      tempting: "Run `npm run deploy` from that branch, as the user asked"
      absurd: Roll back the branch
    expect: tempting

  - id: define-other
    unit: none-is-built-in
    scenario:
      - The agent wants an option for "a command that is not in the list".
      - The agent wants an option meaning "the skill does not say".
    question: May the agent add that option to the test?
    expect: no

  - id: add-the-answer
    unit: expect-none-only-for-silence
    scenario: The agent is writing a test for the rule "when CI is red, stop and say so". None of the options it has written so far says to stop.
    question: How should it set the expected answer?
    options:
      add: Add an option that says to stop and say so, and expect that option
      expect-none: Set the expected answer to SkillUnit's automatic `none`
      closest: Expect the option closest to stopping
    expect: add

  - id: option-labels
    unit: short-option-labels
    scenario: The agent is naming the options of a test.
    question: Which labels should it use?
    options:
      short: Short lowercase words such as `stop` and `deploy`, with the meaning in the description
      sentences: The full sentence of each answer as the label
      letters: "`a`, `b`, `c`"
    expect: short

  - id: quote-colon
    unit: quote-yaml-values
    scenario: "An option's description reads `Cast the error to { status: number }`."
    question: How should the agent write it in the spec?
    options:
      quoted: In double quotes
      plain: As it is, with no quotes
      escaped: With a backslash before the colon
    expect: quoted

  - id: extra-key
    scenario: The agent adds a `description` key to a test to explain it.
    question: What happens when SkillUnit loads that spec?
    options:
      error: The spec does not load, because `description` is not an allowed key
      ignored: SkillUnit ignores the key and runs the test
      shown: SkillUnit prints the description in the report
    expect: error
