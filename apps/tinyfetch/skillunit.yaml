# SkillUnit settings for tinyfetch. From this folder: npx nx skill tinyfetch
skill: ./skill          # built from skill-src and the tests; what agents read
source: ./skill-src     # the skill as people write it
context: "tinyfetch is a small HTTP client for JSON APIs, built on fetch."
# `skillunit proof` runs the tests, puts each unit a test declares where skill-src has
# `{{unit:<id>}}`, fills `{{value:<id>.<name>}}`, and formats the result with Prettier.
proof:
  run: "npx vitest run"
  format: "npx --no-install prettier --write {file}"
