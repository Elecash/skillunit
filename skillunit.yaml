# SkillUnit checking its own skill. From the repository root:
#   npm run skill:dry     proof, and the questions load and fit; sends nothing
#   npm run skill         the same, and the questions asked to TypeSafe (needs TYPESAFE_API_KEY)
skill: ./skills/skillunit         # built: what agents install and read
source: ./skills-src/skillunit    # the skill as people write it
context: "SkillUnit is a command-line tool that checks that an agent skill still says what the code it describes does: it builds the units a test can prove from the project's tests, and asks a decision model closed questions about the skill's text."
# `skillunit proof` runs the tests that declare the units of the skill and their questions, and
# builds skills/skillunit from skills-src/skillunit. They are the files named `*.skill.test.ts`,
# and two files whose units need fixtures of the tests around them; CI runs the whole suite.
proof:
  run: "cd packages/skillunit && npx vitest run skill.test src/env.test.ts src/test/runner.test.ts"
